  experience:
    enable: true
    items:

      - company: "Microsoft"
        companyUrl: "https://www.microsoft.com"
        companyLogo: "https://upload.wikimedia.org/wikipedia/commons/9/96/Microsoft_logo_%282012%29.svg"
        jobs:
          - name: "Cloud and AI Engineer"
            date: "Feb 2026 – Present"
            content: |-
              Joined Microsoft's Cloud + AI engineering division to architect and ship next-generation
              intelligent cloud solutions — bringing 8 years of production AI scars to one of the world's
              most consequential engineering organisations.

              - Building enterprise-grade agentic AI systems on Azure with a focus on real-time inference
                infrastructure and multi-model orchestration
              - Designing scalable AI platform patterns that reduce the path from model to production for
                engineering teams across Microsoft's global customer base
              - Evangelising responsible AI engineering practices, production observability, and AI system
                design at Microsoft scale — internally and externally through the engineering community
              - Leveraging deep experience in RAG, GenAI pipelines, and MLOps to accelerate Azure AI
                product development and customer adoption

      - company: "Manulife"
        companyUrl: "https://www.manulife.com"
        companyLogo: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Manulife_logo.svg"
        jobs:
          - name: "Director, Generative AI"
            date: "May 2024 – Feb 2026 · 1 yr 10 mos"
            content: |-
              Owned Manulife's entire GenAI strategy and engineering execution — from concept to
              production across one of Canada's largest financial services companies (CAD $1.3T AUM,
              38M customers globally). Promoted from Senior ML Engineer in under 2 years.

              - **Designed and shipped an AI-powered straight-through underwriting engine** that
                compressed policy approval time from multiple days down to under 2 minutes — directly
                transforming a process affecting millions of customers and unlocking significant
                operational cost savings across North America and Asia
              - **Built Manulife's contact centre intelligence platform** serving 110M+ calls annually,
                combining real-time speech transcription, dynamic RAG-powered knowledge retrieval,
                and GenAI-driven agent assist — reducing average handle time and lifting customer
                satisfaction scores across the board
              - **Architected the enterprise GenAI enablement platform** from zero, accelerating AI
                adoption across 100+ business units globally; established responsible AI governance
                frameworks and guardrails that became the company-wide standard
              - **Redesigned the global MLOps backbone** across North America and Asia, enabling
                multi-region model serving at sub-200ms p99 latency and billions of inferences
                per month — a 10× improvement in throughput over the previous architecture
              - Grew and led a cross-functional team of engineers, ML scientists, and AI specialists
                spanning three continents; drove hiring, technical direction, and engineering culture

          - name: "Senior Machine Learning Engineer"
            date: "Feb 2022 – May 2024 · 2 yrs 4 mos"
            content: |-
              Senior ML engineer building production AI systems at the intersection of insurance,
              wealth management, and data science — promoted to Director within 2 years on the
              back of measurable business impact.

              - Designed and deployed production ML models for insurance underwriting, risk scoring,
                and claims triage — directly reducing loss ratios and manual review backlogs at scale
              - Led the re-architecture of the ML feature store and inference pipeline, cutting model
                deployment time from weeks to hours and enabling real-time scoring at production volume
              - Built Manulife's first large language model fine-tuning and evaluation pipeline,
                setting the technical foundation for the entire GenAI programme that followed
              - Instrumented model monitoring and automated drift detection across the ML estate,
                eliminating silent failures that had previously cost the business undetected
              - Mentored 6 ML engineers; instituted code review practices, MLOps standards, and
                a culture of engineering rigour that persisted beyond my time in the role

          - name: "Machine Learning Engineer"
            date: "Jan 2021 – Feb 2022 · 1 yr 2 mos"
            content: |-
              First ML engineering role at Manulife — built the infrastructure and models that
              would eventually power the company's AI platform.

              - Built end-to-end MLOps pipelines using Azure ML and Databricks, bringing model
                deployment to production in a regulated financial services environment for the first
                time, from scratch
              - Developed NLP and classification models for document extraction, customer intent
                recognition, and compliance automation — processing hundreds of thousands of
                documents monthly with measurable accuracy gains over manual processes
              - Established data pipeline standards and feature engineering frameworks that became
                the baseline all subsequent ML work was built on

          - name: "Full Stack Engineer"
            date: "Sep 2019 – Dec 2020 · 1 yr 4 mos"
            content: |-
              Full Stack Engineer delivering customer-facing digital products and internal
              automation platforms for Manulife's insurance and wealth management lines.

              - Delivered customer-facing web applications used by millions of Manulife policyholders,
                built in React and TypeScript on Azure-hosted microservices
              - Engineered internal process automation tools that eliminated weeks of manual operations
                work per quarter across business teams
              - Contributed to Manulife's cloud migration initiative, re-platforming legacy Java
                applications to containerised microservices on AKS
              - Established front-end component library and engineering standards that measurably
                accelerated UI delivery across the squad

      - company: "Accenture"
        companyUrl: "https://www.accenture.com"
        companyLogo: "https://upload.wikimedia.org/wikipedia/commons/c/cd/Accenture.svg"
        jobs:
          - name: "Advanced Application Engineer"
            date: "Aug 2018 – Dec 2019 · 1 yr 5 mos"
            content: |-
              Advanced Application Engineer at Accenture's Technology practice, delivering enterprise
              software solutions for financial services and insurance clients across North America.

              - Led full-stack delivery of complex enterprise client applications, translating ambiguous
                business requirements into scalable, production-grade software on aggressive timelines
              - Deployed cloud-native solutions on Azure and AWS, supporting client migrations from
                on-premise to cloud as part of Accenture's digital transformation practice
              - Worked within large globally distributed Agile/SAFe teams, consistently shipping
                high-quality software across multiple concurrent client engagements
              - Built and maintained Java and Node.js backend services integrated with third-party
                financial data providers and enterprise middleware

      - company: "NMI"
        companyUrl: "https://www.nmi.com"
        companyLogo: "https://www.nmi.com/wp-content/themes/nmi/images/NMI_Logo_Primary.webp"
        jobs:
          - name: "Project Engineer"
            date: "Jul 2017 – Aug 2018 · 1 yr 2 mos"
            content: |-
              Project Engineer at Agreement Express — a fintech onboarding platform used by banks
              and financial institutions to digitise client onboarding workflows (later acquired by NMI).

              - Developed and maintained a Google Material Design responsive web application using
                HTML5, CSS, JavaScript, Polymer, React, and React Native; served as primary engineer
                on several high-priority client customisation streams
              - Delivered new features and maintained the core platform independently within a large
                distributed engineering team, with minimal oversight
              - Resolved complex third-party financial data integration failures that had been blocking
                enterprise client onboarding — recovering stalled deals
              - Partnered directly with Business Analysts and Project Managers to translate client
                compliance workflow requirements into custom platform implementations

