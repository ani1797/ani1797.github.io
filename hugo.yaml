  about:
    enable: true
    title: "About Me"
    content: |-
      I'm a Staff Engineer who has spent 8+ years closing the gap between "AI proof-of-concept" and
      "AI running reliably in production at scale" — and I've learned, the hard way, exactly what that gap costs
      when you get it wrong.

      Most recently I was **Director of Generative AI at Manulife**, where I owned the company's entire GenAI
      roadmap from the first whiteboard sketch to platforms deployed across **100+ business units globally**.
      Before that promotion I spent three years at Manulife as a Machine Learning Engineer and Senior ML Engineer,
      building the infrastructure layer by layer — feature stores, inference pipelines, MLOps tooling, model
      monitoring — the unglamorous work that makes everything else possible.

      The headline numbers: an AI-powered underwriting engine that took a core insurance process from **days to
      under 2 minutes**, a contact centre intelligence platform serving **110M+ calls annually** with real-time
      RAG-powered knowledge retrieval, and an enterprise MLOps backbone running **billions of inferences per month**
      with sub-200ms p99 latency.

      In **February 2026** I joined Microsoft's Cloud + AI engineering division to take those hard-won lessons to
      a larger stage — building the next generation of intelligent cloud infrastructure and evangelising production
      AI engineering at Microsoft scale.
